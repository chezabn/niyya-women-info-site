    <link rel="apple-touch-icon" href="media/logo.png">
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>
    <header class="site-header">
      <nav class="nav" aria-label="Navigation principale">
        <a class="brand" href="index.html" aria-label="Niyya Women — accueil">
          <img class="brand-logo" src="media/logo.png" alt="">
          <span class="brand-name">Niyya Women</span>
        </a>
        <button class="menu-toggle" type="button" data-menu-toggle aria-expanded="false" aria-controls="main-nav" aria-label="Ouvrir le menu">☰</button>
        <div class="nav-links" id="main-nav" data-nav-links>
          <a href="index.html">Accueil</a>
          <a href="a-propos.html">À propos</a>

          <a href="mentions-legales.html">Mentions légales</a>
        </div>
      </nav>
    </header>
    <main>
      <div class="document">
        <div class="document-header">
          <div class="eyebrow">Assistance</div>
          <h1>Signaler un problème</h1>
          <div class="document-meta">Décrivez le problème afin que nous puissions vous aider.</div>
        </div>
        <article class="card document-card">
          <form class="form-grid" data-report-form data-report-endpoint="https://api.niyya-women.com/api/support/">
            <div class="field">
              <label for="category">Type de problème</label>
              <select id="category" name="category">
                <option>Bug ou fonctionnalité</option>
                <option>Compte</option>
                <option>Contenu ou comportement</option>
                <option>Sécurité</option>
                <option>Autre</option>
              </select>
            </div>
            <div class="field">
              <label for="email">Adresse e-mail</label>
              <input id="email" name="email" type="email" autocomplete="email" placeholder="vous@example.com">
            </div>
            <div class="field">
              <label for="message">Description</label>
              <textarea id="message" name="message" required placeholder="Expliquez ce qui s'est passé, les étapes pour reproduire le problème et, si possible, le résultat attendu."></textarea>
            </div>
            <button class="button" type="submit">Envoyer le signalement</button>
            <div class="form-message" data-report-message role="status"></div>
          </form>
        </article>
      </div>
    </main>

      <div class="footer-inner">

        </div>
      </div>
    </footer>

  </body>
</html>
