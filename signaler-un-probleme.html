<main><div class="document"><div class="document-header"><div class="eyebrow">Assistance</div><h1>Signaler un problème</h1><div class="document-meta">Décrivez le problème afin que nous puissions vous aider.</div></div><article class="card document-card"><form class="form-grid" data-report-form>
<div class="field"><label for="category">Type de problème</label><select id="category" name="category"><option>Bug ou fonctionnalité</option><option>Compte</option><option>Contenu ou comportement</option><option>Sécurité</option><option>Autre</option></select></div>
<div class="field"><label for="email">Adresse e-mail</label><input id="email" name="email" type="email" autocomplete="email" placeholder="vous@example.com"><p class="help-text">Facultatif si vous êtes déjà connectée à l'application.</p></div>
<div class="field"><label for="message">Description</label><textarea id="message" name="message" required placeholder="Expliquez ce qui s'est passé, les étapes pour reproduire le problème et, si possible, le résultat attendu."></textarea></div>
<button class="button" type="submit">Envoyer le signalement</button>
<div class="form-message" data-report-message role="status"></div>
</form></article></div></main>
